name: PowerShell Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path ./win_update_util.ps1 -ExcludeRule PSAvoidUsingWriteHost,PSUseBOMForUnicodeEncodedFile -EnableExit

  pester:
    name: Pester Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Pester tests
        shell: pwsh
        run: |
          # Run Pester tests and output detailed results
          Invoke-Pester -Path ./tests/win_update_util.Tests.ps1 -Output Detailed

      - name: Run Dry-Run verification for PowerShell script
        shell: pwsh
        run: |
          # Verify PowerShell script runs cleanly in dry-run mode
          pwsh -File ./win_update_util.ps1 -Yes -DryRun -Notify
